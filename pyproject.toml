[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-stock-market-predictor"
version = "0.1.0"
description = "Serviço unificado de treinamento de modelos e API para previsão de mercado."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Marina Oliveira" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.6",
  # TensorFlow 2.15.x requer NumPy < 2.0
  "numpy>=1.26,<2.0",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "joblib>=1.3",
  "sqlalchemy>=2.0",
  "python-dotenv>=1.0",
  "httpx>=0.26",

  # Fonte de dados (Yahoo Finance) usada no /predict e no notebook
  "yfinance>=0.2",

  # Execução de notebook para /train
  "nbclient>=0.10",
  "nbformat>=5.10",
  "ipykernel>=6.29",
  "jupyter_client>=8.0",

  # Modelo (LSTM/Keras) para treino e inferência
  "tensorflow==2.15.1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=4",
  "ruff>=0.4",
  "black>=24.10",
  "mypy>=1.8"
]

[project.scripts]
ml-api = "scripts.run_api:main"
ml-train = "scripts.run_training:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
plugins = []